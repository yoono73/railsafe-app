<style>
/* ===== 기본 리셋 ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #f0f2f5; color: #1a1a2e; }

/* ===== 레이아웃 ===== */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── 상단 헤더 ── */
#header {
  background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
  color: #fff;
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
#header .breadcrumb {
  font-size: 13px;
  opacity: 0.8;
  letter-spacing: 0.5px;
}
#header .title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
}
#header .header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ── 메인 콘텐츠 영역 ── */
#main { display: flex; flex: 1; overflow: hidden; }

/* ── 왼쪽 사이드바 (오버레이 드로어 방식) ── */
#sidebar {
  width: 280px;
  min-width: 220px;
  max-width: 340px;
  background: #fff;
  border-right: 1px solid #e0e4ef;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  /* 기본: 오버레이로 숨김 */
  position: fixed;
  top: 52px;
  left: 0;
  bottom: 0;
  z-index: 200;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  box-shadow: 4px 0 16px rgba(0,0,0,0.2);
}
#sidebar.open { transform: translateX(0); }

/* ── 데스크톱: sidebar를 push-content 방식으로 ── */
@media (min-width: 768px) {
  #sidebar {
    position: relative !important;
    transform: none !important;
    box-shadow: none !important;
    transition: width 0.25s ease !important;
    top: auto; left: auto; bottom: auto; z-index: 1;
  }
  #sidebar:not(.open) {
    width: 0 !important;
    min-width: 0 !important;
    overflow: hidden !important;
  }
  #overlay, #overlay.active { display: none !important; }
}

/* ── 오버레이 배경 ── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  top: 52px;
  background: rgba(0,0,0,0.35);
  z-index: 150;
}
#overlay.active { display: block; }

/* ── 사이드바 상단 ── */
#sidebar-header {
  background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
  color: #fff;
  padding: 14px 16px 12px;
  flex-shrink: 0;
}
#sidebar-header .sys-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
#progress-bar-wrap {
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  height: 6px;
  overflow: hidden;
  margin-bottom: 4px;
}
#progress-bar { height: 100%; background: #64b5f6; border-radius: 4px; transition: width 0.3s; }
#progress-text { font-size: 11px; opacity: 0.9; }

/* 통합 인쇄 버튼 (header 우측) */
#btn-print-all {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.15s;
  flex-shrink: 0;
}
#btn-print-all:hover { background: rgba(255,255,255,0.28); }

/* ── 목차 스크롤 영역 ── */
#toc-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
#toc-scroll::-webkit-scrollbar { width: 4px; }
#toc-scroll::-webkit-scrollbar-thumb { background: #c5cae9; border-radius: 2px; }

/* ── PART 그룹 ── */
.part-group { border-bottom: 1px solid #f0f2f5; }
.part-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  cursor: pointer;
  user-select: none;
  font-size: 12px;
  font-weight: 700;
  color: #37474f;
  background: #f8f9fe;
  border-left: 3px solid transparent;
  transition: background 0.15s;
}
.part-header:hover { background: #eef0fb; }
.part-header.open { border-left-color: #3949ab; color: #283593; }
.part-header .part-arrow { font-size: 10px; color: #90a4ae; transition: transform 0.2s; }
.part-header.open .part-arrow { transform: rotate(180deg); }
.part-header .part-count { font-size: 10px; color: #90a4ae; margin-left: 4px; font-weight: 400; }

/* ── UNIT 목록 ── */
.unit-list { display: none; }
.unit-list.open { display: block; }

.unit-item {
  display: flex;
  align-items: center;
  padding: 7px 14px 7px 20px;
  cursor: default;
  font-size: 12px;
  color: #90a4ae;
  transition: background 0.12s;
  border-left: 3px solid transparent;
}
.unit-item.hold-open {
  cursor: pointer;
}
.unit-item.hold-open:hover { background: #fff8f0; color: #b45309; }
.unit-item.published {
  color: #37474f;
  cursor: pointer;
}
.unit-item.published:hover { background: #eef0fb; color: #283593; }
.unit-item.active {
  background: #e8eaf6 !important;
  border-left-color: #3f51b5 !important;
  color: #283593 !important;
  font-weight: 600;
}
.unit-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  margin-right: 8px;
  flex-shrink: 0;
  background: #cfd8dc;
}
.unit-item.published .unit-dot { background: #42a5f5; }
.unit-item.active .unit-dot { background: #3f51b5; }
.unit-label { line-height: 1.3; }

/* ── 오른쪽 뷰어 ── */
#viewer-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f0f2f5;
}

#unit-iframe {
  flex: 1;
  width: 100%;
  border: none;
  background: #fff;

/* ── 시작 화면 ── */
#welcome-screen {

  text-align: center;

  padding: 40px;

#welcome-screen h2 { font-size: 22px; font-weight: 700; color: #283593; }
#welcome-screen p { font-size: 14px; line-height: 1.6; max-width: 400px; }
#welcome-screen .published-list {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;

#welcome-screen .pub-chip {
  background: #e8eaf6;
  color: #3f51b5;
  border: 1px solid #c5cae9;
  border-radius: 14px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;

#welcome-screen .pub-chip:hover { background: #c5cae9; }

/* ── 목차 토글 버튼 (항상 표시) ── */

  display: block;
  background: none;
  border: none;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  padding: 0 4px;

/* ── 준비중 뱃지 ── */
.pending-badge {
  font-size: 10px;
  color: #bdbdbd;
  margin-left: 4px;
}
</style>

/* PART 메타 */
const PART_META = {
  '01': 'PART 01 · 철도일반',
  '02': 'PART 02 · 선로계획·설계',
  '03': 'PART 03 · 선로기하구조',
  '04': 'PART 04 · 궤도구조',
  '05': 'PART 05 · 선로설비·정거장',
  '06': 'PART 06 · 선로보수·관리',
  '07': 'PART 07 · 신호',
  '08': 'PART 08 · 열차제어·통신',
  '09': 'PART 09 · 전기철도·전력공급',
  '10': 'PART 10 · 전차선로·가선·집전',
  '11': 'PART 11 · 차량 총론',
  '12': 'PART 12 · 열차성능',
  '13': 'PART 13 · 차량구조',
  '14': 'PART 14 · 특수차량',
};

/* ============================================================
   진행률 계산
   ============================================================ */
const TOTAL = UNITS.length;
const PUBLISHED = UNITS.filter(u => u.status === 'published');
const PUB_COUNT = PUBLISHED.length;
const PCT = Math.round(PUB_COUNT / TOTAL * 10) / 10;

/* ============================================================
   목차 렌더링
   ============================================================ */
function buildTOC() {
  const toc = document.getElementById('toc-scroll');
  // PART별 그루핑
  const parts = {};
  UNITS.forEach(u => {
    if (!parts[u.part]) parts[u.part] = [];
    parts[u.part].push(u);
  });

  Object.keys(parts).sort().forEach(partKey => {
    const list = parts[partKey];
    const partName = PART_META[partKey] || ('PART ' + partKey);
    const pubInPart = list.filter(u => u.status === 'published').length;

    const grp = document.createElement('div');
    grp.className = 'part-group';
    grp.id = 'part-' + partKey;

    const hdr = document.createElement('div');
    hdr.className = 'part-header';
    hdr.innerHTML = `<span>${partName}</span><span><span class="part-count">${pubInPart > 0 ? '●'.repeat(Math.min(pubInPart,3)) + ' ' : ''}${list.length}개</span><span class="part-arrow">▼</span></span>`;
    hdr.onclick = () => togglePart(partKey);

    const ul = document.createElement('div');
    ul.className = 'unit-list';
    ul.id = 'ul-' + partKey;

    list.forEach(u => {
      const li = document.createElement('div');
      const openable = u.status === 'published' || (u.status === 'hold' && u.file);
      li.className = 'unit-item' + (u.status === 'published' ? ' published' : '') + (openable && u.status === 'hold' ? ' hold-open' : '');
      li.id = 'unit-item-' + u.id;
      li.dataset.id = u.id;
      if (openable) {
        li.onclick = () => loadUnit(u.id);
      }
      const badge = u.status === 'hold' ? '<span class="pending-badge" style="background:#d97706;">HOLD</span>' : u.status !== 'published' ? '<span class="pending-badge">준비중</span>' : '';
      li.innerHTML = `<span class="unit-dot"></span><span class="unit-label">${u.id} ${u.title}${badge}</span>`;
      ul.appendChild(li);
    });

    grp.appendChild(hdr);
    grp.appendChild(ul);
    toc.appendChild(grp);
  });
}

function togglePart(partKey) {
  const hdr = document.querySelector('#part-' + partKey + ' .part-header');
  const ul = document.getElementById('ul-' + partKey);
  const isOpen = ul.classList.contains('open');
  hdr.classList.toggle('open', !isOpen);
  ul.classList.toggle('open', !isOpen);
}

function openPart(partKey) {
  const hdr = document.querySelector('#part-' + partKey + ' .part-header');
  const ul = document.getElementById('ul-' + partKey);
  if (hdr) hdr.classList.add('open');
  if (ul) ul.classList.add('open');
}

/* ============================================================
   UNIT 로드
   ============================================================ */
let activeUnitId = null;

function canOpen(unit) {
  return unit && (unit.status === 'published' || (unit.status === 'hold' && unit.file));
}

function loadUnit(unitId) {
  const unit = UNITS.find(u => u.id === unitId);
  if (!canOpen(unit)) return;

  // URL 상태 반영
  const url = new URL(window.location.href);
  url.searchParams.set('unit', unitId);
  window.history.pushState({ unitId }, '', url.toString());

  activateUnit(unitId, unit);
}

function activateUnit(unitId, unit) {
  if (!unit) unit = UNITS.find(u => u.id === unitId);
  if (!canOpen(unit)) return;

  // 이전 active 해제
  if (activeUnitId) {
    const prev = document.getElementById('unit-item-' + activeUnitId);
    if (prev) prev.classList.remove('active');
  }
  activeUnitId = unitId;

  // 현재 active
  const el = document.getElementById('unit-item-' + unitId);
  if (el) el.classList.add('active');

  // PART 펼치기
  openPart(unit.part);

  // active 항목 스크롤 노출
  setTimeout(() => {
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 100);

  // viewer bar 업데이트

  // 시작화면 숨기고 iframe 표시
  document.getElementById('welcome-screen').style.display = 'none';
  const iframe = document.getElementById('unit-iframe');
  iframe.style.display = 'block';
  iframe.onload = function() {
    try {
      const doc = this.contentDocument;
      if (!doc || !doc.head) return;
      if (doc.getElementById('__gate5-width-override')) return;
      const style = doc.createElement('style');
      style.id = '__gate5-width-override';
      style.textContent = [
        /* WEB 전용: 화면에서만 130px 우측 안전여백 + 폭 확장 */
        '@media screen {',
        '  .container, .page-wrap {',
        '    max-width: none !important;',
        '    margin: 0 !important;',
        '    padding-left: 24px !important;',
        '    padding-right: 130px !important;',
        '  }',
        '  .print-btn { right: 16px !important; }',
        '}',
        /* PRINT 전용: WEB override 제거, site-header 숨기기 */
        '@media print {',
        '  .site-header {',
        '    display: none !important;',
        '    margin: 0 !important;',
        '    padding: 0 !important;',
        '    height: 0 !important;',
        '    overflow: hidden !important;',
        '    border: none !important;',
        '  }',
        '  .container, .page-wrap {',
        '    max-width: none !important;',
        '    margin: 0 !important;',
        '    padding: 0 !important;',
        '  }',
        '}'
      ].join('\n');
      doc.head.appendChild(style);
    } catch(e) {}
  };
  iframe.src = unit.file;

  // 모바일: 목차 닫기
  closeMobileMenu();
}

/* ============================================================
   URL 파라미터 처리
   ============================================================ */
function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const unitId = params.get('unit');
  if (unitId) {
    const unit = UNITS.find(u => u.id === unitId);
    if (canOpen(unit)) {
      activateUnit(unitId, unit);
      return;
    }
    // pending or not found: 기본 화면 + 해당 PART 펼치기
    if (unit) openPart(unit.part);
  }
  // 기본: PART 07 펼치기 (published UNIT 있는 첫 PART)
  openPart('07');
}

/* ============================================================
   진행률 렌더링
   ============================================================ */
function renderProgress() {
  document.getElementById('progress-bar').style.width = PCT + '%';
  document.getElementById('progress-text').textContent = `완료 ${PUB_COUNT} / ${TOTAL} UNIT  (${PCT}%)`;
  document.getElementById('pub-count-inline').textContent = PUB_COUNT;

  // 빠른 접근 링크
  const ql = document.getElementById('quick-links');
  PUBLISHED.forEach(u => {
    const chip = document.createElement('span');
    chip.className = 'pub-chip';
    chip.textContent = u.id + ' ' + u.title;
    chip.onclick = () => loadUnit(u.id);
    ql.appendChild(chip);
  });
}

/* ============================================================
   모바일 메뉴
   ============================================================ */
function toggleMobileMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('active');
}
function closeMobileMenu() {
  // 모바일에서만 닫기 (데스크톱은 목차 고정 유지)
  if (window.innerWidth < 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }
}

/* ============================================================
   popstate (뒤로/앞으로 버튼)
   ============================================================ */
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.unitId) {
    const unit = UNITS.find(u => u.id === e.state.unitId);
    activateUnit(e.state.unitId, unit);
  } else {
    // 시작화면으로
    document.getElementById('welcome-screen').style.display = '';
    document.getElementById('unit-iframe').style.display = 'none';
    document.getElementById('unit-iframe').src = 'about:blank';
    if (activeUnitId) {
      const prev = document.getElementById('unit-item-' + activeUnitId);
      if (prev) prev.classList.remove('active');
      activeUnitId = null;
    }
  }
});

/* ============================================================
   초기화
   ============================================================ */
buildTOC();
renderProgress();
loadFromURL();

// 데스크톱에서 목차 자동 열기 (고정)
if (window.innerWidth >= 768) {
  document.getElementById('sidebar').classList.add('open');
}
</script>
