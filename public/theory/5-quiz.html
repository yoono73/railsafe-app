<script>
const STORAGE_KEY = 'quiz5wrong';
const NUMS = ['①','②','③','④'];

const QUESTIONS = [
  {num:1,q:'철도산업발전기본법의 제정 목적에 해당하지 않는 것은?',c:['철도산업의 공익적 기능과 경제적 성과의 강화','철도산업의 효율성 및 공익성의 향상','철도산업의 경쟁력을 높이고 발전기반을 조성','국민경제의 발전에 이바지함'],a:0,e:'제1조(목적): 이 법은 철도산업의 경쟁력을 높이고 발전기반을 조성함으로써 철도산업의 효율성 및 공익성의 향상과 국민경제의 발전에 이바지함을 목적으로 한다. "공익적 기능과 경제적 성과의 강화"는 목적 조항에 없다.',t:'kibchul'},
  {num:2,q:'\'철도\'의 정의로 맞는 것은?',c:['철도차량을 운전하기 위한 궤도','철도차량을 운행하기 위한 노반','철도차량을 운행하기 위한 공작물로 구성된 시설','여객 또는 화물을 운송하는 데 필요한 철도시설과 철도차량 및 이와 관련된 운영·지원체계가 유기적으로 구성된 운송체계'],a:3,e:'제3조(정의) 1. "철도"라 함은 여객 또는 화물을 운송하는 데 필요한 철도시설과 철도차량 및 이와 관련된 운영·지원체계가 유기적으로 구성된 운송체계를 말한다.',t:'kibchul'},
  {num:3,q:'철도산업발전기본법상 \'철도시설\'에 해당하지 않는 것은?',c:['철도경영연수 및 철도전문인력의 교육훈련을 위한 시설','철도의 전철전력설비, 정보통신설비, 신호 및 열차제어설비','철도차량을 제작하는 시설','철도의 선로, 역시설 및 철도운영을 위한 건축물·건축설비'],a:2,e:'제3조(정의) 철도시설은 선로, 역시설, 전철전력설비, 정보통신설비, 신호설비, 선로보수기지, 차량정비기지, 교육훈련시설, 연계운영시설 등이다. "철도차량을 제작하는 시설"은 철도시설이 아니라 제조업 시설이다.',t:'kibchul'},
  {num:4,q:'철도산업발전기본법에서 정의한 철도차량을 모두 고르시오. (ㄱ.화차 ㄴ.객차 ㄷ.동력차 ㄹ.특수차)',c:['ㄱ','ㄴ, ㄷ, ㄹ','ㄱ, ㄷ','ㄱ, ㄴ, ㄷ, ㄹ'],a:3,e:'제3조(정의) 4. "철도차량"이라 함은 선로를 운행할 목적으로 제작된 동력차·객차·화차 및 특수차를 말한다. 4가지 모두 해당한다.',t:'kibchul'},
  {num:5,q:'철도운영자가 영리목적의 영업활동과 관계없이 국가 또는 지방자치단체의 정책이나 공공목적 등을 위하여 제공하는 철도서비스를 말하는 용어는?',c:['무상서비스','무임승차','철도서비스','공익서비스'],a:3,e:'제3조(정의) 11. "공익서비스"라 함은 철도운영자가 영리목적의 영업활동과 관계없이 국가 또는 지방자치단체의 정책이나 공공목적 등을 위하여 제공하는 철도서비스를 말한다.',t:'kibchul'},
  {num:6,q:'국가교통안전기본계획의 수립권자와 수립주기가 올바르게 짝지어진 것은?',c:['국토교통부장관 - 1년','국토교통부장관 - 5년','대통령 - 1년','대통령 - 5년'],a:1,e:'교통안전법 제15조: 국토교통부장관은 국가의 전반적인 교통안전수준의 향상을 도모하기 위하여 교통안전에 관한 기본계획을 5년 단위로 수립하여야 한다.',t:'kibchul'},
  {num:7,q:'철도산업위원회의 위원 구성과 운영에 관한 설명으로 틀린 것은?',c:['철도산업위원회 위원장은 국토교통부장관이 된다.','위원회 및 분과위원회의 구성·기능 및 운영에 관하여 필요한 사항은 대통령령으로 정한다.','구성은 위원장을 포함 20인 이내로 구성한다.','위원회에 상정할 안건을 미리 검토하고 위원회가 위임한 안건을 심의하기 위하여 위원회에 분과위원회를 둔다.'],a:2,e:'제6조(철도산업위원회) ③ 위원회는 위원장을 포함한 25인 이내의 위원으로 구성한다. (20인이 아닌 25인이다)',t:'kibchul'},
  {num:8,q:'철도산업위원회에 대한 설명으로 틀린 것은?',c:['철도산업위원회는 위원장을 포함한 25인 이내의 위원으로 구성한다.','위원의 임기는 5년으로 하되, 연임할 수 있다.','위원회 및 분과위원회의 구성·기능 및 운영에 관하여 필요한 사항은 대통령령으로 정한다.','철도산업에 관한 기본계획 및 중요정책 등을 심의·조정하기 위하여 국토교통부에 철도산업위원회를 둔다.'],a:1,e:'시행령 제6조: 위원의 임기는 2년으로 하되, 연임할 수 있다. (5년이 아니라 2년이다)',t:'kibchul'},
  {num:9,q:'철도산업위원회 위원장으로 옳은 것은?',c:['국토교통부장관','대통령','국무총리','교통안전공단 이사장'],a:0,e:'제6조(철도산업위원회): 철도산업위원회의 위원장은 국토교통부장관이 된다.',t:'kibchul'},
  {num:10,q:'실무위원회 구성으로 틀린 것은?',c:['실무위원회는 위원장을 포함한 20인 이내의 위원으로 구성한다.','위원장은 국토교통부장관이 된다.','위원회의 심의·조정사항과 위원회에서 위임한 사항의 실무적인 검토를 위하여 위원회에 실무위원회를 둔다.','실무위원회에 간사 1인을 두되, 간사는 국토교통부장관이 국토교통부소속 공무원 중에서 지명한다.'],a:1,e:'시행령 제10조(실무위원회의 구성 등) ③: 실무위원회의 위원장은 국토교통부장관이 국토교통부의 3급 공무원 또는 고위공무원단에 속하는 일반직공무원 중에서 지명한다. (국토교통부장관이 직접 위원장이 되는 것이 아니다)',t:'kibchul'},
  {num:11,q:'실무위원회의 위원장은 누가 지정하는가?',c:['국토교통부장관','철도산업위원회 위원장','대통령','국무총리'],a:0,e:'시행령 제10조: 실무위원회의 위원장은 국토교통부장관이 국토교통부의 3급 공무원 또는 고위공무원단에 속하는 일반직공무원 중에서 지명한다.',t:'kibchul'},
  {num:12,q:'철도산업정보화 기본계획에 포함되지 않는 것은?',c:['철도산업정보화의 여건 및 전망','철도산업정보의 유통 및 이용활성화에 관한 사항','철도산업정보의 수집 및 조사계획','철도산업 정보화 추진을 위한 내부·외부 기반 마련 관련 사항'],a:3,e:'시행령 제15조 철도산업정보화기본계획 포함 사항: 1.여건 및 전망, 2.목표 및 단계별 추진계획, 3.필요한 비용, 4.정보의 수집 및 조사계획, 5.유통 및 이용활성화, 6.기술개발 지원, 7.기타. "내부·외부 기반 마련"은 없다.',t:'kibchul'},
  {num:13,q:'철도협회 설립 시 정관의 기재사항과 협회의 운영 등에 필요한 사항은 무엇으로 정하는가?',c:['대통령령','국토교통부령','법무부령','국가철도공단규정'],a:0,e:'제13조의2(협회의 설립) ⑥: 협회의 정관은 국토교통부장관의 인가를 받아야 하며, 정관의 기재사항과 협회의 운영 등에 필요한 사항은 대통령령으로 정한다.',t:'kibchul'},
  {num:14,q:'철도서비스 품질평가의 절차 및 활용 등에 관하여 필요한 사항은 어떤 령으로 정하는가?',c:['행정안전부령','국토교통부령','대통령령','국무총리령'],a:1,e:'제15조(철도서비스의 품질개선 등): 철도서비스 품질평가의 절차 및 활용 등에 관하여 필요한 사항은 국토교통부령으로 정한다.',t:'kibchul'},
  {num:15,q:'철도 이용자의 권익보호 시책에 해당하지 않는 것은?',c:['철도이용자의 생명·신체 및 재산상의 위해 방지','철도이용자의 불만 및 피해에 대한 신속·공정한 구제조치','철도이용자의 요금부담 완화 및 환급절차 개선','철도이용자의 권익보호를 위한 홍보·교육 및 연구'],a:2,e:'제16조(철도이용자의 권익보호 등) 시책: 1.홍보·교육 및 연구, 2.생명·신체·재산 위해 방지, 3.불만 및 피해 구제조치, 4.기타. "요금부담 완화 및 환급절차 개선"은 명시된 시책이 아니다.',t:'kibchul'},
  {num:16,q:'철도산업 구조개혁 기본계획에 포함되어야 하는 내용이 아닌 것은?',c:['철도산업구조개혁의 추진방안에 관한 사항','철도안전관리 체계의 인증 및 점검절차에 관한 사항','철도산업구조개혁에 따른 대내외 여건조성에 관한 사항','철도산업구조개혁에 따른 자산·부채·인력 등에 관한 사항'],a:1,e:'제18조 구조개혁계획 포함 사항: 목표 및 기본방향, 추진방안, 소유 및 경영구조 개혁, 대내외 여건조성, 자산·부채·인력, 기관·단체 정비, 기타. "철도안전관리 체계의 인증 및 점검절차"는 포함 사항이 아니다.',t:'kibchul'},
  {num:17,q:'철도시설관리자와 철도운영자가 협력이 필요한 사항에 대하여 정기적으로 작성 교환하도록 규정된 문서는 무엇인가?',c:['업무절차서','운영계획서','시설관리표준서','안전관리지침서'],a:0,e:'시행령 제23조(업무절차서의 교환 등): 철도시설관리자와 철도운영자는 상호협력이 필요한 분야에 대하여 업무절차서를 작성하여 정기적으로 교환하고, 변경 시 즉시 통보하여야 한다.',t:'kibchul'},

  {num:19,q:'철도시설관리권 내용 중 틀린 것은?',c:['철도시설관리권의 설정을 받은 자는 대통령령으로 정하는 바에 따라 국토교통부장관에게 등록하여야 한다.','철도시설관리권은 이를 용역권으로 본다.','저당권이 설정된 철도시설관리권은 그 저당권자의 동의가 없으면 처분할 수 없다.','철도시설관리권의 설정·변경·소멸 및 처분의 제한은 철도시설관리권등록부에 등록함으로써 효력이 발생한다.'],a:1,e:'제26조(철도시설관리권): 철도시설관리권은 물권(物權)으로 본다. 용역권이 아니라 물권이다.',t:'kibchul'},

  {num:26,q:'[신유형] 철도산업위원회가 심의·조정하는 사항이 아닌 것은?',c:['철도산업의 육성·발전에 관한 중요정책 사항','철도시설관리자와 철도운영자간 상호협력 및 조정에 관한 사항','철도산업구조개혁에 관한 중요정책 사항','그 밖에 철도산업에 관한 중요한 사항으로서 위원이 회의에 부치는 사항'],a:3,e:'제6조: 위원회 심의·조정 사항 중 7번째는 "그 밖에 철도산업에 관한 중요한 사항으로서 위원장이 회의에 부치는 사항"이다. 위원이 아닌 위원장이다.',t:'new'},
  {num:27,q:'[신유형] 실무위원회의 위원장은?',c:['국토교통부장관이 국토교통부의 3급 공무원 또는 고위공무원단에 속하는 일반직공무원 중에서 지명한다.','국토교통부장관','대통령','국가철도공단의 임직원 중 국가철도공단 이사장이 지명하는 자 1인'],a:0,e:'시행령 제10조(실무위원회의 구성 등): 실무위원회의 위원장은 국토교통부장관이 국토교통부의 3급 공무원 또는 고위공무원단에 속하는 일반직공무원 중에서 지명한다.',t:'new'},
  {num:28,q:'[신유형] 철도자산의 구분에 해당하지 않는 것은?',c:['시설자산','운영자산','관리자산','기타자산'],a:2,e:'제22조(철도자산의 구분): 철도자산은 1.운영자산, 2.시설자산, 3.기타자산으로 구분한다. "관리자산"은 없다.',t:'new'},
  {num:29,q:'[신유형] 비상사태 시 국토교통부장관이 할 수 있는 조치가 아닌 것은?',c:['대체수송수단 및 수송로의 확보','철도서비스 인력의 투입','수송요금 인하 등에 관한 사항','철도이용의 제한 또는 금지'],a:2,e:'제36조(비상사태시 처분): 수송통제, 시설·차량 가동·조업, 대체수송수단 확보, 임시열차 편성·운행, 인력 투입, 철도이용 제한 또는 금지, 기타 대통령령 사항이 조치에 해당한다. "수송요금 인하"는 해당 조치가 아니다.',t:'new'},
  {num:30,q:'[신유형] 철도운영자 등이 철도안전관리체계의 승인 또는 변경승인을 받아야 하는 경우 중, 철도노선의 신설 또는 개량에 해당하는 기준으로 옳은 것은?',c:['선로의 연장이 1km 이상이면서 역이 1개 이상인 경우','선로의 연장이 2km 이상이면서 역이 2개 이상인 경우','선로의 연장이 5km 이상이면서 역이 1개 이상인 경우','선로의 연장이 10km 이상이면서 역이 2개 이상인 경우'],a:1,e:'철도안전관리체계 승인 기준: 선로의 연장이 2km 이상이면서 역이 2개 이상인 경우 철도노선의 신설 또는 개량에 해당한다.',t:'new'},
];

let wrongSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));
let wrongOnlyMode = false;

function saveWrong() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...wrongSet]));
}

function updateWrongBar() {
  const bar = document.getElementById('wrong-bar');
  const badge = document.getElementById('wrong-count-badge');
  badge.textContent = wrongSet.size;
  bar.style.display = wrongSet.size > 0 ? 'flex' : 'none';
}

function togglePart(bodyId, arrowId) {
  const body = document.getElementById(bodyId);
  const arrow = document.getElementById(arrowId);
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  arrow.textContent = hidden ? '▼' : '▶';
}

function buildItem(q) {
  const id = 'q' + q.num;
  const isNew = q.t === 'new';
  const div = document.createElement('div');
  div.className = 'qbank-item' + (isNew ? ' new-type' : '');
  div.id = id;
  div.innerHTML = `
    <div>
      <span class="qbank-num">${q.num}번</span>
      <span class="qbank-tag">${isNew ? '신유형' : '기출변형'}</span>
    </div>
    <div class="qbank-q">${q.q}</div>
    <ul class="qbank-choices" id="choices${q.num}">
      ${q.c.map((c,i)=>`<li data-num="${NUMS[i]}" data-idx="${i}" onclick="pick(${q.num},${i})">${c}</li>`).join('')}
    </ul>
    <button class="qbank-reveal" onclick="reveal(${q.num},${q.a},'${q.e.replace(/'/g,"\\'")}')">정답 확인</button>
    <div class="qbank-explain" id="explain${q.num}"></div>
  `;
  return div;
}

function pick(num, idx) {
  const ul = document.getElementById('choices'+num);
  ul.querySelectorAll('li').forEach(li => li.classList.remove('selected'));
  ul.querySelectorAll('li')[idx].classList.add('selected');
}

function reveal(num, ans, exp) {
  const ul = document.getElementById('choices'+num);
  const expEl = document.getElementById('explain'+num);
  const items = ul.querySelectorAll('li');
  let userSel = -1;
  items.forEach((li,i) => { if(li.classList.contains('selected')) userSel = i; });

  items.forEach((li,i) => {
    if(i === ans) li.classList.add('ans-correct');
    else if(i === userSel) li.classList.add('ans-wrong');
    li.style.cursor = 'default';
    li.onclick = null;
  });

  expEl.style.display = 'block';
  expEl.textContent = '해설: ' + exp;

  if(userSel === -1 || userSel !== ans) {
    wrongSet.add(String(num));
  } else {
    wrongSet.delete(String(num));
  }
  saveWrong();
  updateWrongBar();
  markWrong();
}

function markWrong() {
  document.querySelectorAll('.qbank-item').forEach(item => {
    const num = item.id.replace('q','');
    const note = item.querySelector('.qbank-wrong-note');
    if(wrongSet.has(num)) {
      if(!note) {
        const n = document.createElement('span');
        n.className = 'qbank-wrong-note';
        n.textContent = '❌ 오답 기록됨';
        item.appendChild(n);
      }
    } else {
      if(note) note.remove();
    }
  });
}

function toggleWrongMode() {
  wrongOnlyMode = !wrongOnlyMode;
  const btn = document.getElementById('btn-wrong-only');
  btn.textContent = wrongOnlyMode ? '전체 보기' : '틀린 문제만 보기';
  document.querySelectorAll('.qbank-item').forEach(item => {
    const num = item.id.replace('q','');
    item.style.display = wrongOnlyMode ? (wrongSet.has(num) ? '' : 'none') : '';
  });
}

function resetAllItems() {
  if(!confirm('모든 오답 기록을 초기화합니까?')) return;
  wrongSet.clear();
  saveWrong();
  updateWrongBar();
  markWrong();
  wrongOnlyMode = false;
  document.getElementById('btn-wrong-only').textContent = '틀린 문제만 보기';
  document.querySelectorAll('.qbank-item').forEach(item => {
    item.style.display = '';
    item.querySelectorAll('li').forEach(li => {
      li.className = '';
      li.style.cursor = 'pointer';
    });
    const expEl = item.querySelector('.qbank-explain');
    if(expEl) { expEl.style.display = 'none'; expEl.textContent = ''; }
  });
  // Re-bind click events
  document.querySelectorAll('.qbank-choices li').forEach(li => {
    const num = li.closest('.qbank-item').id.replace('q','');
    const idx = parseInt(li.dataset.idx);
    li.onclick = () => pick(parseInt(num), idx);
  });
}

// Build DOM
const kibchulBody = document.getElementById('p-kibchul');
const newBody = document.getElementById('p-new');
QUESTIONS.forEach(q => {
  if(q.t === 'kibchul') kibchulBody.appendChild(buildItem(q));
  else newBody.appendChild(buildItem(q));
});

updateWrongBar();
markWrong();
</script>
