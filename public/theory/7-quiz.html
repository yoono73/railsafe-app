<script>
const STORAGE_KEY = 'quiz7wrong';
const NUMS = ['①','②','③','④'];

const QUESTIONS = [
  {num:1,q:'철도안전법 제정일로 옳은 것은?',c:['2004.10.22','2003.10.22','2002.10.22','2005.10.22'],a:0,e:'철도안전법은 2004년 10월 22일 제정되었다.',t:'kibchul'},
  {num:2,q:'철도안전을 확보하기 위하여 필요한 사항을 규정하고 철도안전 관리체계를 확립함으로써 공공복리의 증진에 이바지함을 목적으로 하는 법의 이름은?',c:['교통안전법','철도산업발전기본법','철도안전법','철도공사법'],a:2,e:'철도안전법 제1조(목적): 철도안전을 확보하기 위하여 필요한 사항을 규정하고 철도안전 관리체계를 확립함으로써 공공복리의 증진에 이바지함을 목적으로 한다.',t:'kibchul'},
  {num:3,q:'철도안전법 제2조에서 정의하는 \'열차\'란 무엇인가?',c:['철도노선에 등록된 모든 차량의 총칭','선로를 운행할 목적으로 철도운영자가 편성하여 열차번호를 부여한 철도차량','기관차 1량으로만 구성된 차량','여객 운송을 목적으로 한 차량'],a:1,e:'철도안전법 제2조 6호: \'열차\'란 선로를 운행할 목적으로 철도운영자가 편성하여 열차번호를 부여한 철도차량을 말한다.',t:'kibchul'},
  {num:4,q:'철도안전법에서 \'철도종사자\'에 포함되지 않는 것은?',c:['여객승무원','운전업무종사자','작업책임자','철도안전전문연구원'],a:3,e:'철도안전법 제2조 10호 철도종사자 목록에 철도안전전문연구원은 포함되지 않는다.',t:'kibchul'},
  {num:5,q:'다음 중 「철도안전법」에서 규정하는 \'철도종사자\'에 해당하지 않는 사람은?',c:['여객에게 역무(驛務) 서비스를 제공하는 사람','철도차량의 운전업무에 종사하는 사람','철도안전전문기술자','철도차량의 운행을 집중 제어·통제·감시하는 업무에 종사하는 사람'],a:2,e:'철도안전법 제2조 10호: 철도안전전문기술자는 철도종사자에 해당하지 않는다.',t:'kibchul'},
  {num:6,q:'철도안전법 용어의 정의에 대한 설명 중 옳지 않은 것은?',c:['\'운행장애\'란 철도사고 및 철도준사고를 포함하여 철도차량의 운행에 지장을 주는 것으로서 국토교통부령으로 정하는 것을 말한다.','\'철도차량정비\'란 철도차량을 점검·검사, 교환 및 수리하는 행위를 말한다.','\'선로전환기\'란 철도차량의 운행선로를 변경시키는 기기를 말한다.','\'선로\'란 철도차량을 운행하기 위한 궤도와 이를 받치는 노반 또는 인공구조물로 구성된 시설을 말한다.'],a:0,e:'\'운행장애\'란 철도사고 및 철도준사고 \'외에\' 철도차량의 운행에 지장을 주는 것을 말한다. \'포함\'이 아니라 \'외에\'가 맞다.',t:'kibchul'},
  {num:7,q:'철도사고 및 철도준사고 외에 철도차량의 운행에 지장을 주는 것으로서 국토교통부령으로 정하는 것을 무엇이라고 하는가?',c:['기타철도교통사고','철도교통사고','철도안전사고','운행장애'],a:3,e:'철도안전법 제2조 13호: \'운행장애\'란 철도사고 및 철도준사고 외에 철도차량의 운행에 지장을 주는 것으로서 국토교통부령으로 정하는 것을 말한다.',t:'kibchul'},
  {num:8,q:'정거장의 정의로 틀린 것은?',c:['열차가 여객의 승하차 또는 화물의 적하를 위하여 정차하는 장소를 말한다.','열차의 교행이나 대피, 운전 취급을 위하여 설치된 장소도 포함된다.','단순히 신호 제어만을 위한 지점을 말한다.','열차를 조성하는 곳을 포함한다.'],a:2,e:'철도안전법 시행령 제2조: \'정거장\'이란 여객의 승하차, 화물의 적하, 열차의 조성, 열차의 교차통행 또는 대피를 목적으로 사용되는 장소를 말한다. 단순 신호제어 지점은 해당 안 된다.',t:'kibchul'},
  {num:9,q:'철도안전법상 철도차량정비기술자가 갖추고 인정받아야 하는 사항이 아닌 것은?',c:['학력','경력','이력','자격'],a:0,e:'철도안전법 제2조 15호: 철도차량정비기술자란 철도차량정비에 관한 자격, 경력 및 학력 등을 갖추어 국토교통부장관의 인정을 받은 사람이다. \'이력\'은 해당하지 않는다.',t:'kibchul'},
  {num:10,q:'철도안전법에서 말하는 \'안전운행 또는 질서유지 철도종사자\'에 해당하지 않는 사람은?',c:['정거장에서 열차의 조성업무를 수행하는 사람','정거장에서 철도신호기·선로전환기 또는 조작판 등을 취급하는 사람','철도사고, 철도준사고 및 운행장애가 발생한 현장에서 조사·수습·복구 등의 업무를 수행하는 사람','철도에 공급되는 전력의 원격제어장치를 공급하는 사람'],a:3,e:'원격제어장치를 \'공급\'하는 사람이 아니라 \'운영\'하는 사람이 철도종사자에 해당한다.',t:'kibchul'},
  {num:11,q:'철도시설 관리와 관련된 사고로 맞는 것은?',c:['열차화재사고','철도화재사고','탈선사고','충돌사고'],a:1,e:'철도안전법 시행규칙 제1조의2: 철도시설 관리와 관련된 사고는 철도안전사고이며, 철도화재사고(철도시설에서 화재)가 이에 해당한다.',t:'kibchul'},
  {num:12,q:'철도준사고에 속하는 것은?',c:['철도차량이 다른 철도차량 또는 장애물과 충돌하거나 접촉한 사고','관제의 사전승인 없는 정차역 통과','운행허가를 받지 않은 구간으로 열차가 주행하는 경우','철도역사, 기계실 등 철도시설에서 화재가 발생하는 사고'],a:2,e:'①은 철도사고, ②는 운행장애, ④는 철도안전사고이고, ③ 운행허가를 받지 않은 구간으로 열차가 주행하는 경우가 철도준사고에 해당한다.',t:'kibchul'},
  {num:13,q:'철도준사고가 아닌 것은?',c:['열차 또는 철도차량이 승인 없이 정지신호를 지난 경우','철도차량의 차륜의 균열로 철도차량이 궤도를 이탈하는 사고','안전운행에 지장을 주는 철도차량의 차륜, 차축, 차축베어링에 균열 등의 고장이 발생한 경우','철도차량에서 화약류 등 위험물 또는 위해물품이 누출된 경우'],a:1,e:'②는 철도교통사고(탈선사고)에 해당하며 철도준사고가 아니다.',t:'kibchul'},
  {num:14,q:'운행장애가 아닌 것은?',c:['역장의 사전승인 없는 정차역 통과','고속열차: 20분 이상 운행지연','일반여객열차: 30분 이상 운행지연','화물열차 및 기타열차: 60분 이상 운행지연'],a:0,e:'운행장애 중 정차역 통과는 \'관제의 사전승인 없는\' 경우이며, \'역장의 사전승인 없는\'은 틀린 표현이다.',t:'kibchul'},
  {num:15,q:'철도안전 종합계획의 수립주기와 수립의무자는?',c:['국토교통부장관-1년','국토교통부장관-5년','대통령-1년','대통령-5년'],a:1,e:'철도안전법 제5조: 국토교통부장관은 5년마다 철도안전에 관한 종합계획을 수립하여야 한다.',t:'kibchul'},
  {num:16,q:'철도안전종합계획 수립 변경 시 고시하는 방법으로 옳은 것은?',c:['일간지','홈페이지','관보','공보'],a:2,e:'철도안전법 제5조 ⑤항: 국토교통부장관은 철도안전 종합계획을 수립하거나 변경하였을 때에는 이를 관보에 고시하여야 한다.',t:'kibchul'},
  {num:17,q:'철도안전종합계획 변경 중 경미한 사항으로 볼 수 있는 것은?',c:['철도안전 종합계획에서 정한 총사업비를 원래 계획의 100분의 10 이내에서의 변경','철도안전 종합계획에서 정한 총사업비를 원래 계획의 100분의 15 이내에서의 변경','철도안전 종합계획에서 정한 총사업비를 원래 계획의 100분의 20 이내에서의 변경','철도안전 종합계획에서 정한 총사업비를 원래 계획의 100분의 30 이내에서의 변경'],a:0,e:'철도안전법 시행령 제4조: 경미한 사항 변경은 총사업비를 원래 계획의 100분의 10 이내에서의 변경이 해당한다.',t:'kibchul'},
  {num:18,q:'시행계획 수립절차에서 다음 연도의 시행계획 제출 기한으로 옳은 것은?',c:['10월말-2월말','10월말-3월말','11월말-2월말','11월말-3월말'],a:0,e:'철도안전법 시행령 제5조: 다음 연도 시행계획은 매년 10월 말까지 제출, 전년도 추진실적은 매년 2월 말까지 제출.',t:'kibchul'},
  {num:19,q:'철도안전투자의 공시기준에 포함되어야 하는 내용이 아닌 것은?',c:['철도차량 교체에 관한 예산','철도시설 개량에 관한 예산','안전설비의 설치에 관한 예산','노후시설 교체에 관한 예산'],a:3,e:'철도안전법 시행규칙 제1조의5: 공시기준에는 차량교체, 시설개량, 안전설비, 교육훈련, 연구개발, 홍보 등의 예산이 포함된다. \'노후시설 교체\'는 별도 항목이 아니다.',t:'kibchul'},
  {num:20,q:'철도안전투자 공시기준, 항목, 절차에 필요한 사항은 어디서 정하는가?',c:['국토교통부령','대통령령','시도지사','교통안전공단 사장'],a:0,e:'철도안전법 시행규칙 제1조의5 ④항: 공시기준 및 절차 등에 관해 필요한 사항은 국토교통부장관이 정해 고시한다.',t:'kibchul'},

];

let wrongSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'));
let wrongOnlyMode = false;

function saveWrong() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...wrongSet]));
}

function updateWrongBar() {
  const bar = document.getElementById('wrong-bar');
  const badge = document.getElementById('wrong-count-badge');
  badge.textContent = wrongSet.size;
  bar.style.display = wrongSet.size > 0 ? 'flex' : 'none';
}

function togglePart(bodyId, arrowId) {
  const body = document.getElementById(bodyId);
  const arrow = document.getElementById(arrowId);
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  arrow.textContent = hidden ? '▼' : '▶';
}

function buildItem(q) {
  const isNew = q.t === 'new';
  const isWrong = wrongSet.has(q.num + '_' + q.t);
  const div = document.createElement('div');
  div.className = 'qbank-item' + (isNew ? ' new-type' : '');
  div.dataset.key = q.num + '_' + q.t;
  if (isWrong) div.insertAdjacentHTML('afterbegin','<span class="qbank-wrong-note">❌ 오답 기록됨</span>');
  const typeLabel = isNew ? '신유형' : '기출변형';
  div.insertAdjacentHTML('beforeend',
    `<div><span class="qbank-num">No.${q.num}</span><span class="qbank-tag">${typeLabel}</span></div>
     <p class="qbank-q">${q.q}</p>`);
  const ul = document.createElement('ul');
  ul.className = 'qbank-choices';
  q.c.forEach((c,i) => {
    const li = document.createElement('li');
    li.dataset.num = NUMS[i];
    li.dataset.idx = i;
    li.textContent = c;
    li.addEventListener('click', () => selectChoice(li, q, ul, div));
    ul.appendChild(li);
  });
  div.appendChild(ul);
  const btn = document.createElement('button');
  btn.className = 'qbank-reveal';
  btn.textContent = '정답·해설 보기';
  btn.onclick = () => reveal(div, q, ul);
  div.appendChild(btn);
  const exp = document.createElement('div');
  exp.className = 'qbank-explain';
  exp.textContent = q.e;
  div.appendChild(exp);
  return div;
}

function selectChoice(li, q, ul, itemDiv) {
  ul.querySelectorAll('li').forEach(l => l.classList.remove('selected'));
  li.classList.add('selected');
}

function reveal(div, q, ul) {
  ul.querySelectorAll('li').forEach((li,i) => {
    li.classList.remove('selected');
    if (i === q.a) li.classList.add('ans-correct');
    else li.classList.add('ans-wrong');
  });
  const exp = div.querySelector('.qbank-explain');
  exp.style.display = 'block';
  div.querySelector('.qbank-reveal').style.display = 'none';
}

function markWrong(key) {
  wrongSet.add(key);
  saveWrong();
  updateWrongBar();
}

function toggleWrongMode() {
  wrongOnlyMode = !wrongOnlyMode;
  const btn = document.getElementById('btn-wrong-only');
  btn.textContent = wrongOnlyMode ? '전체 보기' : '틀린 문제만 보기';
  renderAll();
}

function resetAllItems() {
  wrongSet.clear();
  saveWrong();
  updateWrongBar();
  wrongOnlyMode = false;
  document.getElementById('btn-wrong-only').textContent = '틀린 문제만 보기';
  renderAll();
}

function renderAll() {
  const kBody = document.getElementById('p-kibchul');
  const nBody = document.getElementById('p-new');
  kBody.innerHTML = '';
  nBody.innerHTML = '';
  QUESTIONS.forEach(q => {
    const key = q.num + '_' + q.t;
    if (wrongOnlyMode && !wrongSet.has(key)) return;
    const el = buildItem(q);
    if (q.t === 'kibchul') kBody.appendChild(el);
    else nBody.appendChild(el);
  });
}

renderAll();
updateWrongBar();
</script>
